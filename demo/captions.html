<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Caption</title>
<!-- One burned-in caption, drawn over a transparent frame (docs/plans/demo-video.md,
     step 5). render.py fills FONT_FACES with IBM Plex Sans and DATA with the
     caption's lines and layout. Text goes in through textContent only; "→" is
     drawn as SVG, since the UI's Plex subsets have no U+2192. -->
<style>
/*FONT_FACES*/
html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
body { font-family: "IBM Plex Sans", sans-serif; -webkit-font-smoothing: antialiased; }
.box {
  position: absolute;
  /* Darker than the UI's #161616 and edged, so the box reads as a caption over
     the UI and the cards alike; the same colour as the UI vanished into it. */
  background: rgba(0, 0, 0, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: #f4f4f4;
  font-weight: 500;
  border-radius: 6px;
  text-align: center;
}
.box div { white-space: nowrap; }
.box svg { height: 0.62em; width: 1.1em; margin: 0 0.12em; vertical-align: 0.02em; fill: #78a9ff; }

/* Main video, 1280 x 720 CSS px: centred in the bottom band below every shot. */
.main .box {
  left: 50%; bottom: 44px; transform: translateX(-50%);
  font-size: 32px; line-height: 1.3; padding: 10px 22px;
}
/* Short, 360 x 640: mid-frame, clear of the bottom 20% and the right 15% that
   YouTube's buttons cover, so centred in x 16-298 rather than the frame. */
.short .box {
  left: 157px; top: 404px; transform: translateX(-50%);
  font-size: 19px; line-height: 1.3; padding: 8px 14px;
}
</style>
</head>
<body>
<div class="box" id="box"></div>
<script>
const DATA = /*DATA*/;
document.body.className = DATA.layout;
const ARROW = '<svg viewBox="0 0 72 40"><path d="M0 17h56L44 5l4-4 19 19-19 19-4-4 12-12H0z"/></svg>';
for (const line of DATA.lines) {
  const row = document.createElement("div");
  line.split("→").forEach((part, i) => {
    if (i > 0) row.insertAdjacentHTML("beforeend", ARROW);  // a constant, never data
    row.append(part);
  });
  document.getElementById("box").append(row);
}
</script>
</body>
</html>

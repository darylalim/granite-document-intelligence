[project]
name = "granite-document-intelligence"
version = "1.0.1"
description = "Local PDF document intelligence on Apple Silicon: converts multi-page PDFs to Markdown and JSON and extracts charts, tables and schema-driven key-values with IBM Granite Docling and Granite Vision on MLX."
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/granite_document_intelligence/ui/static/fonts/LICENSE.txt",
]
requires-python = ">=3.12"
# Floors are the versions PR 4's hand run executed the models on, not researched
# ones; caps guard API drift. Moving any model-touching package needs the eval
# (plan §2.2). transformers never goes below 5.16, the darwin floor no single
# package states (§2.1). mlx is deliberately undeclared: it floats under mlx-vlm
# and uv.lock pins it. pypdfium2, pillow and huggingface-hub are imported
# directly (the chart crop, `gdi convert-model`), so they are declared too, as
# is referencing (the KVP validator's fetch-nothing registry, §3.13 rule 8).
dependencies = [
    "docling-core>=2.105.0,<3",
    "docling[vlm]>=2.143.1,<3",
    "huggingface-hub>=1.33.0",
    "jsonschema>=4.18",
    "mlx-vlm>=0.7.10,<0.8",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.2",
    "referencing>=0.37.0",
    "transformers>=5.21.0,<6",
]

[project.optional-dependencies]
# `gdi ui` (plan §18.5). The floor is the version U1–U4 measured; the cap guards API
# drift, and a Streamlit move in uv.lock re-runs §15's width check, as a model package
# move re-runs the eval.
ui = ["streamlit>=1.66.1,<2"]

[project.scripts]
gdi = "granite_document_intelligence.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pyyaml",
    "ruff",
    "ty",
]
# The `[ui]` extra, so the gate tests the UI and ty checks it and the v1.x prototypes
# (docs/plans/ui-*). Only ui/app.py and ui/launch.py import Streamlit (plan §18.5).
ui = [
    "granite-document-intelligence[ui]",
]

[tool.uv]
default-groups = ["dev", "ui"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
markers = [
    "apptest: the viewer's AppTest layout and view tests; CI runs them, the Stop hook skips them (plan §18.5)",
]

# No `pythonpath`: with the src/ layout the tests import the installed package,
# not the working directory (plan §3.6).

[tool.ty.environment]
python-version = "3.12"
# eval/score.py imports eval/matching.py as a sibling script, the way `python
# eval/score.py` runs it; tests/test_score.py puts eval/ on the path to match.
extra-paths = ["eval"]

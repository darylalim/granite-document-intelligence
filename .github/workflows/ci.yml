name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default so the `check` job — the one that runs code from a fork's
# pull request — cannot write anything. `release` widens its own scope instead.
permissions:
  contents: read

jobs:
  check:
    # Apple Silicon is required: the PDF pipeline runs on mlx/mlx-metal, which
    # uv.lock pins to sys_platform == 'darwin', so a Linux runner can't install
    # it — nor can the x64 macos-*-intel / macos-*-large labels. TestCIWorkflow allow-lists the
    # arm64 labels GitHub currently supports; it is a moving window, not a floor.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to commit SHAs, not tags: a tag can be
      # moved to new code after review, a SHA cannot (plan §3.13 rule 9). The
      # comment names the release the SHA resolved from, for Dependabot and for
      # anyone bumping it by hand. setup-uv publishes no major or minor tags from
      # v8 on, so its comment names the full version. Caching is left at the
      # default `auto` — on for push/pull_request, off for the events where a
      # fork could poison it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - run: uv sync --locked
      - run: ./scripts/gate.sh

  # Tags and publishes a GitHub release whenever pyproject.toml's version has no
  # tag yet; a no-op on every other push. The logic lives in scripts/release.sh
  # for the same reason the gate does — a YAML-escaped one-liner cannot be run or
  # tested, and this one has failure modes worth testing.
  release:
    # `needs` keeps a tag from ever pointing at a red build; the `if` keeps a
    # fork's pull request from releasing anything, and confines it to main.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Not the Apple Silicon runner `check` requires: this job reads a TOML field
    # and calls the GitHub API, and never imports the darwin-only mlx.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job granted write access, and only to contents (tags + releases).
    permissions:
      contents: write
    # Two pushes to main in quick succession would otherwise race for the same
    # tag. Never cancelled: a half-run release is the state being avoided here.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - run: ./scripts/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
          # Names the repository outright rather than leaving gh to infer it from
          # the checkout's git remote. Unset outside Actions, where that inference
          # is what you want.
          GH_REPO: ${{ github.repository }}

# Budgets and regression tolerances that eval/score.py enforces (plan §3.11, §8.2 rule 1).
#
# A run fails when it exceeds any budget below, or when any score in `baseline`
# drops by more than its tolerance. Lowering a baseline score, or raising a time
# budget, needs a committed eval/results/ file showing why, in its own PR — the
# memory ceiling is never raised.

# The results file every later run is compared with. Re-baselining replaces this
# line and says why per moved metric (§8.2 rule 1). Re-baselined on 2026-10-29
# because the corpus changed: PR 2 added the scan and a looping adversarial page,
# and score.py now scores the scan's text against its original. Without the scan
# this run's totals equal PR 7's baseline (2026-10-27-24125f5) on all 29 metrics;
# every moved metric moved by adding the scan to the averages (spike report, S8's
# scanned half).
baseline = "results/2026-10-29-3025669-baseline.json"

[memory]
# A ceiling from the Metal working set on a 16 GB Mac, not a measurement (§3.11).
peak_gb = 10.0

[time]
# PR 7 baseline's medians of three × 1.25 (§3.11), in seconds. Phase A per page is
# the corpus's Phase A time over its pages, model loads and degenerate pages
# included; a chart is one chart's CSV + summary; a KVP page is one page's answer.
# The 2026-10-29 baseline meets each one (Phase A 5.97, up from 5.66 because the
# adversarial page now loops; chart 8.86 with the scan's charts), so none moved.
phase_a_s_per_page = 7.08
# The scan alone, from the 2026-10-29 baseline: 7.04 s/page × 1.25 (S8 scanned).
phase_a_s_per_page_scanned = 8.8
chart_s = 10.34
kvp_page_s = 7.51
# Phase A's converter and model load plus Granite Vision's load, on the first
# PDF of a fresh process (§8.2 rule 8's one cold run).
cold_start_s = 8.91

[capped_pages]
# Pages that hit granite-docling's 8192-token cap at the shipped settings: named
# exceptions decided with the user on 2026-10-25 (§3.11, S11). A capped page not
# listed here fails the run; a listed page that stops capping is reported as a fix.
"gao-07-631" = [24]
# The scan's page 15 (Figure 9) caps on a repeated axis label after its charts and
# prose came through; the original's page 24 does not cap once scanned (its page
# 13). Decided with the user on 2026-10-29, keeping page scale 2.0 (S8 scanned).
"gao-07-631-scan" = [15]
"gao-08-1044-excerpt" = [2]
"irs-w9-filled" = [1]

[tolerance]
# How far a score may fall below the baseline before the run fails (§8.2 rule 1).
# Counts — charts and tables found, false positives, headings, KVP fields,
# oversized chunks, summary pair errors — may not move at all.
count = 0
kvp = 0
# Cell-match and other rates, in percentage points.
rate_pct = 1.0
# Text similarity, word F1 and reading order, as fractions.
text = 0.01
